        <button class="btn btn-secondary" id="btn-snapshot">📷 Save PNG<kbd style="margin-left:4px;font-size:0.6rem;opacity:0.4;background:none;border:none;padding:0;color:inherit;">S</kbd></button>
        <button class="btn btn-secondary" id="btn-share">🔗 Copy Link<kbd style="margin-left:4px;font-size:0.6rem;opacity:0.4;background:none;border:none;padding:0;color:inherit;">C</kbd></button>

  <script src="/shortcuts.js"></script>
  <script>
  (function() {
    'use strict';

    // ── Canvas setup ─────────────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H; // logical dimensions

    function resize() {
      const wrap = canvas.parentElement;
      W = wrap.clientWidth;
      H = wrap.clientHeight;
      canvas.width = W * devicePixelRatio;
      canvas.height = H * devicePixelRatio;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      draw();
    }

    // ── State ────────────────────────────────────────────────────
    let points = [];
    let voronoiCells = [];
    let delaunayTriangles = [];
    let displayMode = 'filled'; // filled | edges | both | points
    let showDelaunay = false;
    let showBoundary = false;
    let animSpeed = 0;
    let running = false;
    let animId = null;
    let currentPalette = 0;
    let jitterSteps = 0;

    // ── Palettes ─────────────────────────────────────────────────
    const PALETTES = [
      { name: 'Ocean',     colors: ['#003049','#005f73','#0a9396','#94d2bd','#e9d8a6','#ee9b00','#ca6702','#bb3e03'] },
      { name: 'Neon',      colors: ['#f72585','#b5179e','#7209b7','#560bad','#480ca8','#3a0ca3','#3f37c9','#4361ee'] },
      { name: 'Earth',     colors: ['#3a5a40','#588157','#a3b18a','#dad7cd','#d4a373','#ccd5ae','#e9edc9','#fefae0'] },
      { name: 'Sunset',    colors: ['#ff006e','#fb5607','#ff006e','#8338ec','#3a86ff','#06d6a0','#ffd166','#ef476f'] },
      { name: 'Monochrome',colors: ['#1a1a2e','#16213e','#0f3460','#1a1a2e','#e94560','#533483','#2b2d42','#8d99ae'] },
      { name: 'Pastel',    colors: ['#ffcdb2','#ffb4a2','#e5989b','#b5838d','#6d6875','#525252','#3d3d3d','#2d2d2d'] },
      { name: 'Tropical',  colors: ['#06d6a0','#1b9aaa','#ef476f','#ffd166','#073b4c','#118ab2','#06d6a0','#ffc43d'] },
      { name: 'Deep',      colors: ['#0b0c10','#1f2833','#c5c6c7','#45a29e','#66fcf1','#45a29e','#1f2833','#0b0c10'] },
    ];

    // Build palette buttons
    const paletteGrid = document.getElementById('palette-grid');
    PALETTES.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn' + (i === 0 ? ' active' : '');
      btn.textContent = p.name;
      btn.dataset.palette = i;
      btn.addEventListener('click', () => {
        currentPalette = i;
        paletteGrid.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        draw();
      });
      paletteGrid.appendChild(btn);
    });

    // ── Fortune's algorithm (brute-force Voronoi via pixel scan) ─
    // For interactive art we use a simpler approach: for each pixel,
    // find the nearest seed point. This gives exact Voronoi.
    // We optimize by only scanning a grid and filling polygons.

    // Better approach: compute Voronoi cells via Fortune's algorithm
    // implemented with a sweep line, then render polygons.

    // Simple but correct: compute Delaunay triangulation via Bowyer-Watson,
    // then dualize to get Voronoi.

    // ── Bowyer-Watson Delaunay triangulation ────────────────────
    function delaunayTriangulate(origPts) {
      if (origPts.length < 2) return [];

      const stx = 0.01; // Super triangle offset factor
      const st = [
        { x: -W * stx, y: -H * stx },
        { x: W * (1 + stx), y: -H * stx },
        { x: W * 0.5, y: H * (1 + stx) }
      ];

      // Build combined point array: original + super triangle
      const pts = origPts.map(p => ({ x: p.x, y: p.y }));
      pts.push(st[0], st[1], st[2]);
      const sa = origPts.length, sb = origPts.length + 1, sc = origPts.length + 2;

      // Triangles: each is { a, b, c, circumCx, circumCy, circumR }
      function makeTri(a, b, c) {
        const ax = pts[a].x - pts[b].x, ay = pts[a].y - pts[b].y;
        const bx = pts[b].x - pts[c].x, by = pts[b].y - pts[c].y;

        // Circumcenter
        const D = 2 * (pts[a].x * (pts[b].y - pts[c].y) + pts[b].x * (pts[c].y - pts[a].y) + pts[c].x * (pts[a].y - pts[b].y));
        if (Math.abs(D) < 1e-10) return null;
        const ux = ((pts[a].x * pts[a].x + pts[a].y * pts[a].y) * (pts[b].y - pts[c].y) +
                     (pts[b].x * pts[b].x + pts[b].y * pts[b].y) * (pts[c].y - pts[a].y) +
                     (pts[c].x * pts[c].x + pts[c].y * pts[c].y) * (pts[a].y - pts[b].y)) / D;
        const uy = ((pts[a].x * pts[a].x + pts[a].y * pts[a].y) * (pts[c].x - pts[b].x) +
                     (pts[b].x * pts[b].x + pts[b].y * pts[b].y) * (pts[a].x - pts[c].x) +
                     (pts[c].x * pts[c].x + pts[c].y * pts[c].y) * (pts[b].x - pts[a].x)) / D;
        const r2 = (pts[a].x - ux) ** 2 + (pts[a].y - uy) ** 2;
        return { a, b, c, cx: ux, cy: uy, r2 };
      }

      let triangles = [];
      const first = makeTri(sa, sb, sc);
      if (first) triangles.push(first);

      for (let i = 0; i < origPts.length; i++) {
        const p = pts[i];
        // Find bad triangles (circumcircle contains point)
        const bad = [];
        for (let t = triangles.length - 1; t >= 0; t--) {
          const tri = triangles[t];
          if ((p.x - tri.cx) ** 2 + (p.y - tri.cy) ** 2 < tri.r2 + 1e-6) {
            bad.push(t);
          }
        }

        // Find boundary of polygonal hole
        const edges = [];
        for (const t of bad) {
          const tri = triangles[t];
          const triEdges = [[tri.a, tri.b], [tri.b, tri.c], [tri.c, tri.a]];
          for (const e of triEdges) {
            let shared = false;
            for (const t2 of bad) {
              if (t2 === t) continue;
              const tri2 = triangles[t2];
              const tri2Edges = [[tri2.a, tri2.b], [tri2.b, tri2.c], [tri2.c, tri2.a]];
              for (const e2 of tri2Edges) {
                if ((e[0] === e2[0] && e[1] === e2[1]) || (e[0] === e2[1] && e[1] === e2[0])) {
                  shared = true; break;
                }
              }
              if (shared) break;
            }
            if (!shared) edges.push(e);
          }
        }

        // Remove bad triangles
        for (const t of [...bad].sort((a, b) => b - a)) {
          triangles.splice(t, 1);
        }

        // Create new triangles from boundary edges to point i
        for (const e of edges) {
          const tri = makeTri(e[0], e[1], i);
          if (tri) triangles.push(tri);
        }
      }

      // Remove triangles that share a vertex with the super triangle
      triangles = triangles.filter(t =>
        t.a < origPts.length && t.b < origPts.length && t.c < origPts.length
      );

      return triangles;
    }

    // ── Dualize Delaunay → Voronoi ──────────────────────────────
    function computeVoronoi(pts) {
      if (pts.length < 3) return { cells: [], triangles: [] };

      const tris = delaunayTriangulate(pts);
      if (tris.length === 0) return { cells: [], triangles: [] };

      // Build edge-to-triangle adjacency
      const edgeMap = new Map();
      for (let i = 0; i < tris.length; i++) {
        const t = tris[i];
        const edges = [[t.a, t.b], [t.b, t.c], [t.c, t.a]];
        for (const e of edges) {
          const key = Math.min(e[0], e[1]) + ':' + Math.max(e[0], e[1]);
          if (!edgeMap.has(key)) edgeMap.set(key, []);
          edgeMap.get(key).push(i);
        }
      }

      // For each point, collect surrounding circumcenters in order
      const cells = new Array(pts.length).fill(null).map(() => []);

      // Sort circumcenters angularly around each point
      for (let pi = 0; pi < pts.length; pi++) {
        // Find all triangles containing this point
        const adjTris = [];
        for (let i = 0; i < tris.length; i++) {
          const t = tris[i];
          if (t.a === pi || t.b === pi || t.c === pi) {
            adjTris.push(i);
          }
        }

        // Get circumcenters
        const cc = adjTris.map(i => ({ x: tris[i].cx, y: tris[i].cy, idx: i }));
        if (cc.length < 3) {
          cells[pi] = cc.map(c => ({ x: c.x, y: c.y }));
          continue;
        }

        // Sort angularly around the point
        const px = pts[pi].x, py = pts[pi].y;
        cc.sort((a, b) => Math.atan2(a.y - py, a.x - px) - Math.atan2(b.y - py, b.x - px));
        cells[pi] = cc.map(c => ({ x: c.x, y: c.y }));
      }

      return { cells, triangles: tris };
    }

    // ── Lloyd relaxation ────────────────────────────────────────
    function lloydRelax(pts) {
      const result = computeVoronoi(pts);
      const newPts = [];
      for (let i = 0; i < pts.length; i++) {
        const cell = result.cells[i];
        if (!cell || cell.length < 3) {
          newPts.push({ x: pts[i].x, y: pts[i].y, vx: pts[i].vx || 0, vy: pts[i].vy || 0 });
          continue;
        }
        // Centroid of polygon (clamped to bounds)
        let cx = 0, cy = 0;
        for (const v of cell) { cx += v.x; cy += v.y; }
        cx /= cell.length;
        cy /= cell.length;
        newPts.push({
          x: Math.max(20, Math.min(W - 20, cx)),
          y: Math.max(20, Math.min(H - 20, cy)),
          vx: pts[i].vx || 0,
          vy: pts[i].vy || 0,
        });
      }
      return newPts;
    }

    // ── Drawing ──────────────────────────────────────────────────
    function draw() {
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, W, H);

      if (points.length === 0) return;

      // Apply jitter
      let workPts = points;
      for (let j = 0; j < jitterSteps; j++) {
        workPts = lloydRelax(workPts);
      }

      const result = computeVoronoi(workPts);
      voronoiCells = result.cells;
      delaunayTriangles = result.triangles;

      const palette = PALETTES[currentPalette].colors;

      // Draw filled cells
      if (displayMode === 'filled' || displayMode === 'both') {
        for (let i = 0; i < voronoiCells.length; i++) {
          const cell = voronoiCells[i];
          if (!cell || cell.length < 3) continue;
          ctx.fillStyle = palette[i % palette.length];
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          // Clamp vertices to canvas bounds
          const clamped = cell.map(v => ({
            x: Math.max(0, Math.min(W, v.x)),
            y: Math.max(0, Math.min(H, v.y))
          }));
          ctx.moveTo(clamped[0].x, clamped[0].y);
          for (let j = 1; j < clamped.length; j++) {
            ctx.lineTo(clamped[j].x, clamped[j].y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      // Draw edges
      if (displayMode === 'edges' || displayMode === 'both') {
        ctx.strokeStyle = displayMode === 'both' ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.7)';
        ctx.lineWidth = displayMode === 'both' ? 0.5 : 1;
        const drawnEdges = new Set();
        for (let i = 0; i < voronoiCells.length; i++) {
          const cell = voronoiCells[i];
          if (!cell || cell.length < 3) continue;
          for (let j = 0; j < cell.length; j++) {
            const v1 = cell[j], v2 = cell[(j + 1) % cell.length];
            const key = Math.min(v1.x, v2.x).toFixed(1) + ',' + Math.min(v1.y, v2.y).toFixed(1) + '|' +
                        Math.max(v1.x, v2.x).toFixed(1) + ',' + Math.max(v1.y, v2.y).toFixed(1);
            if (drawnEdges.has(key)) continue;
            drawnEdges.add(key);
            ctx.beginPath();
            ctx.moveTo(v1.x, v1.y);
            ctx.lineTo(v2.x, v2.y);
            ctx.stroke();
          }
        }
      }

      // Draw Delaunay triangulation
      if (showDelaunay && delaunayTriangles.length > 0) {
        ctx.strokeStyle = 'rgba(126,184,255,0.35)';
        ctx.lineWidth = 0.8;
        for (const tri of delaunayTriangles) {
          ctx.beginPath();
          ctx.moveTo(workPts[tri.a].x, workPts[tri.a].y);
          ctx.lineTo(workPts[tri.b].x, workPts[tri.b].y);
          ctx.lineTo(workPts[tri.c].x, workPts[tri.c].y);
          ctx.closePath();
          ctx.stroke();
        }
      }

      // Draw points
      if (displayMode === 'points' || displayMode === 'both' || points.length < 50) {
        for (let i = 0; i < workPts.length; i++) {
          const p = workPts[i];
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.5)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      updateStats(workPts.length, jitterSteps);
    }

    // ── Generate random points ──────────────────────────────────
    function generatePoints(count) {
      points = [];
      const margin = 30;
      for (let i = 0; i < count; i++) {
        points.push({
          x: margin + Math.random() * (W - 2 * margin),
          y: margin + Math.random() * (H - 2 * margin),
          vx: 0,
          vy: 0,
        });
      }
      draw();
    }

    // ── Animation ────────────────────────────────────────────────
    function animate() {
      if (!running || animSpeed <= 0) return;
      for (const p of points) {
        if (p.vx === undefined) { p.vx = (Math.random() - 0.5) * 2; p.vy = (Math.random() - 0.5) * 2; }
        p.x += p.vx * animSpeed * 0.5;
        p.y += p.vy * animSpeed * 0.5;
        // Bounce off walls
        if (p.x < 10 || p.x > W - 10) { p.vx *= -1; p.x = Math.max(10, Math.min(W - 10, p.x)); }
        if (p.y < 10 || p.y > H - 10) { p.vy *= -1; p.y = Math.max(10, Math.min(H - 10, p.y)); }
        // Random drift
        p.vx += (Math.random() - 0.5) * 0.1;
        p.vy += (Math.random() - 0.5) * 0.1;
        // Dampen
        p.vx *= 0.99;
        p.vy *= 0.99;
      }
      draw();
      animId = requestAnimationFrame(animate);
    }

    function togglePlay() {
      running = !running;
      document.getElementById('btn-pause').textContent = running ? '⏸ Pause' : '▶ Play';
      if (running) animate();
      else if (animId) cancelAnimationFrame(animId);
    }

    // ── Mouse interaction ────────────────────────────────────────
    let dragging = null;
    let dragOffset = { x: 0, y: 0 };

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      // Check if clicking near an existing point
      for (let i = 0; i < points.length; i++) {
        const dx = points[i].x - mx, dy = points[i].y - my;
        if (dx * dx + dy * dy < 200) {
          dragging = i;
          dragOffset = { x: dx, y: dy };
          return;
        }
      }

      // Otherwise add a new point
      points.push({ x: mx, y: my, vx: 0, vy: 0 });
      document.getElementById('point-count').value = points.length;
      document.getElementById('v-count').textContent = points.length;
      draw();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (dragging === null) return;
      const rect = canvas.getBoundingClientRect();
      points[dragging].x = Math.max(5, Math.min(W - 5, e.clientX - rect.left - dragOffset.x));
      points[dragging].y = Math.max(5, Math.min(H - 5, e.clientY - rect.top - dragOffset.y));
      draw();
    });

    canvas.addEventListener('mouseup', () => { dragging = null; });
    canvas.addEventListener('mouseleave', () => { dragging = null; });

    // ── Controls ─────────────────────────────────────────────────
    const pointCount = document.getElementById('point-count');
    const vCount = document.getElementById('v-count');
    const animSpeedEl = document.getElementById('anim-speed');
    const vSpeed = document.getElementById('v-speed');
    const jitterEl = document.getElementById('jitter-steps');
    const vJitter = document.getElementById('v-jitter');

    pointCount.addEventListener('input', () => {
      vCount.textContent = pointCount.value;
      generatePoints(+pointCount.value);
    });

    animSpeedEl.addEventListener('input', () => {
      animSpeed = +animSpeedEl.value;
      vSpeed.textContent = animSpeed.toFixed(1);
      if (animSpeed > 0 && !running) togglePlay();
      else if (animSpeed <= 0 && running) togglePlay();
    });

    jitterEl.addEventListener('input', () => {
      jitterSteps = +jitterEl.value;
      vJitter.textContent = jitterSteps;
      draw();
    });

    // Display mode buttons
    document.querySelectorAll('#display-modes .mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        displayMode = btn.dataset.mode;
        document.querySelectorAll('#display-modes .mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        draw();
      });
    });

    // Delaunay toggle
    document.getElementById('btn-delaunay').addEventListener('click', function() {
      showDelaunay = !showDelaunay;
      this.classList.toggle('active', showDelaunay);
      draw();
    });

    // Boundary toggle
    document.getElementById('btn-boundary').addEventListener('click', function() {
      showBoundary = !showBoundary;
      this.classList.toggle('active', showBoundary);
      draw();
    });

    // Regenerate
    document.getElementById('btn-regenerate').addEventListener('click', () => {
      generatePoints(+pointCount.value);
    });

    // Clear
    document.getElementById('btn-clear').addEventListener('click', () => {
      points = [];
      voronoiCells = [];
      delaunayTriangles = [];
      draw();
    });

    // Pause
    document.getElementById('btn-pause').addEventListener('click', togglePlay);

    // Snapshot
    document.getElementById('btn-snapshot').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'voronoi-' + Date.now() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Share
    document.getElementById('btn-share').addEventListener('click', () => {
      copyShareURL();
    });

    // ── Stats ────────────────────────────────────────────────────
    function updateStats(count, relax) {
      document.getElementById('stats').textContent = count + ' points · ' + relax + ' relaxations';
    }

    // ── Random helper (for shortcuts.js) ─────────────────────────
    window.shortcuts_random = function() {
      // Randomize palette and point count
      currentPalette = Math.floor(Math.random() * PALETTES.length);
      paletteGrid.querySelectorAll('.preset-btn').forEach((b, i) => {
        b.classList.toggle('active', i === currentPalette);
      });
      const count = 10 + Math.floor(Math.random() * 90);
      pointCount.value = count;
      vCount.textContent = count;
      generatePoints(count);
    };

    window.shortcuts_redraw = function() {
      generatePoints(+pointCount.value);
    };

    // ── Share interface ──────────────────────────────────────────
    window.getShareParams = function() {
      return {
        count: points.length,
        palette: currentPalette,
        mode: displayMode,
        delaunay: showDelaunay,
        boundary: showBoundary,
        speed: animSpeed,
        jitter: jitterSteps,
        points: points.map(p => [Math.round(p.x), Math.round(p.y)]),
      };
    };

    window.applyShareParams = function(params) {
      if (params.count && params.points && params.points.length > 0) {
        points = params.points.map(p => ({ x: p[0], y: p[1], vx: 0, vy: 0 }));
      } else if (params.count) {
        pointCount.value = params.count;
        vCount.textContent = params.count;
        generatePoints(params.count);
      }
      if (params.palette !== undefined) {
        currentPalette = params.palette;
        paletteGrid.querySelectorAll('.preset-btn').forEach((b, i) => {
          b.classList.toggle('active', i === currentPalette);
        });
      }
      if (params.mode) {
        displayMode = params.mode;
        document.querySelectorAll('#display-modes .mode-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.mode === displayMode);
        });
      }
      if (params.delaunay !== undefined) {
        showDelaunay = params.delaunay;
        document.getElementById('btn-delaunay').classList.toggle('active', showDelaunay);
      }
      if (params.boundary !== undefined) {
        showBoundary = params.boundary;
        document.getElementById('btn-boundary').classList.toggle('active', showBoundary);
      }
      if (params.speed !== undefined) {
        animSpeed = params.speed;
        animSpeedEl.value = animSpeed;
        vSpeed.textContent = animSpeed.toFixed(1);
      }
      if (params.jitter !== undefined) {
        jitterSteps = params.jitter;
        jitterEl.value = jitterSteps;
        vJitter.textContent = jitterSteps;
      }
      draw();
    };

    function copyShareURL() {
      if (typeof window.getShareParams !== 'function') return;
      const params = window.getShareParams();
      const json = JSON.stringify(params);
      const b64 = btoa(unescape(encodeURIComponent(json)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const url = location.origin + location.pathname + '?p=' + b64;
      navigator.clipboard.writeText(url).then(() => {
        // Toast
        const toast = document.createElement('div');
        toast.textContent = '🔗 Link copied!';
        Object.assign(toast.style, {
          position: 'fixed', top: '72px', left: '50%', transform: 'translateX(-50%)',
          padding: '8px 20px', background: 'rgba(100,200,100,0.9)', color: '#fff',
          borderRadius: '8px', fontSize: '0.85rem', fontWeight: '600', zIndex: '10001',
          pointerEvents: 'none', transition: 'opacity 0.4s',
          fontFamily: 'system-ui, sans-serif',
        });
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        setTimeout(() => { toast.remove(); }, 2900);
      }).catch(() => {});
    }

    // ── Restore from URL ─────────────────────────────────────────
    function restoreFromURL() {
      const params = new URLSearchParams(location.search);
      const p = params.get('p');
      if (p && typeof window.applyShareParams === 'function') {
        try {
          let b64 = p.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          const json = decodeURIComponent(escape(atob(b64)));
          const parsed = JSON.parse(json);
          // Defer to after resize
          setTimeout(() => window.applyShareParams(parsed), 100);
          return true;
        } catch (e) { console.warn('Failed to parse share params', e); }
      }
      return false;
    }

    // ── Init ─────────────────────────────────────────────────────
    window.addEventListener('resize', resize);
    resize();
    if (!restoreFromURL()) {
      generatePoints(30);
    }
  })();
  </script>
</body>
</html>
